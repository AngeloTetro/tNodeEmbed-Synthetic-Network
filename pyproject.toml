[project]
name = "social-network-temporal"
version = "0.1.0"
description = "Analisi dell'evoluzione temporale di una rete sociale su snapshot (esame Big Data)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.1",
    "networkx>=3.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "gensim>=4.3",
    "torch>=2.6",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

# torch da PyTorch (build CUDA): la macchina ha una RTX 3060 con 6 GB.
# Se questo indice non risponde, ripiegare su cu124 / cu128.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 120
target-version = "py311"
